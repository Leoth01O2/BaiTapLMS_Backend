<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Facebook Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">facebook</div>
    <input type="text" placeholder="Tìm kiếm trên Facebook">
</header>

<div class="container">
    <aside class="left-sidebar">
        <h3>Phan Duy Hưng</h3>
        <p>Trang chủ</p>
        <p>Bạn bè</p>
        <p>Nhóm</p>
        <p>Marketplace</p>
    </aside>

    <main>
        <div class="post-box">
            <h3>Tạo bài viết</h3>
            <textarea placeholder="Bạn đang nghĩ gì?"></textarea>
            <button>Đăng</button>
        </div>

        <div class="post">
            <h3>Ngô Trung Kiên</h3>
            <p>Hôm nay là một ngày đẹp trời.</p>
        </div>

        <div class="post">
            <h3>Phan Duy Hưng</h3>
            <p>Đang học CSS để làm giao diện Facebook.</p>
        </div>
    </main>

    <aside class="right-sidebar">
        <h3>Người liên hệ</h3>
        <p>Ngô Trung Kiên</p>
        <p>Vũ Đức Đạt</p>
        <p>Phan Duy Hưng</p>
    </aside>
</div>

</body>
</html>
