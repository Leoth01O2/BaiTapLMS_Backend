<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreativeChronicle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container my-5">

    <div class="author-section">
        <div class="author-info">
            <div class="author-avatar"></div>
            <div>
                <h5 class="mb-0">Jane Doe</h5>
                <small>Published on Oct 25, 2026</small>
            </div>
        </div>

        <div class="share-buttons">
            <button class="btn btn-primary btn-sm">Share Facebook</button>
            <button class="btn btn-dark btn-sm">Tweet</button>
        </div>
    </div>

    <div class="mosaic-gallery">
        <div class="photo photo-main">Main Photo</div>
        <div class="photo photo-sub">Sub Photo 1</div>
        <div class="photo photo-sub">Sub Photo 2</div>
    </div>

    <p class="mt-4">
        Đây là nội dung bài báo. Giao diện đã được tái cấu trúc bằng Flexbox, CSS Grid và Bootstrap để hiển thị ổn định trên nhiều kích thước màn hình
    </p>

    <h3 class="mt-5 mb-3">Recommended Articles</h3>

    <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100">
                <div class="card-body">Article 1</div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100">
                <div class="card-body">Article 2</div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100">
                <div class="card-body">Article 3</div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100">
                <div class="card-body">Article 4</div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
