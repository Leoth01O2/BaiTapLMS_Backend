<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">
    <h2>Responsive Image Gallery</h2>
    <p>Resize the browser window to see the effect</p>

    <div class="row g-3">
        <div class="col-12 col-sm-6 col-lg-3">
            <div class="border">
                <img src="https://demo.codegym.vn/web/15/gallery/img_fjords.jpg" class="img-fluid w-100" alt="Fjords">
                <p class="p-3 mb-0 text-center">Add a description of the image here</p>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="border">
                <img src="https://demo.codegym.vn/web/15/gallery/img_forest.jpg" class="img-fluid w-100" alt="Forest">
                <p class="p-3 mb-0 text-center">Add a description of the image here</p>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="border">
                <img src="https://demo.codegym.vn/web/15/gallery/img_lights.jpg" class="img-fluid w-100" alt="Lights">
                <p class="p-3 mb-0 text-center">Add a description of the image here</p>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="border">
                <img src="https://demo.codegym.vn/web/15/gallery/img_mountains.jpg" class="img-fluid w-100" alt="Mountains">
                <p class="p-3 mb-0 text-center">Add a description of the image here</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
