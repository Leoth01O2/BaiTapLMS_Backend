<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricsHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar-custom">
    <div class="logo">MetricsHub</div>
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">VeryLongGermanWordForDashboard</a>
        <a href="#">Contact</a>
    </div>
    <div class="profile">Profile</div>
</nav>

<div class="container py-4">
    <h2 class="mb-3">Dashboard</h2>

    <div class="grid-dashboard">
        <div class="widget widget-large">Chart A</div>
        <div class="widget">Chart B</div>
        <div class="widget">Chart C</div>
        <div class="widget">Chart D</div>
        <div class="widget widget-wide">Chart E</div>
    </div>

    <h2 class="mt-5 mb-3">Pricing</h2>

    <div class="row g-3">
        <div class="col-12 col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h4 class="card-title">Gói Cơ bản</h4>
                    <p class="card-text">Phù hợp cho cá nhân.</p>
                    <button class="btn btn-primary">Chọn gói</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h4 class="card-title">Gói Nâng cao</h4>
                    <p class="card-text">Phù hợp cho nhóm nhỏ.</p>
                    <button class="btn btn-primary">Chọn gói</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h4 class="card-title">Gói Doanh nghiệp</h4>
                    <p class="card-text">Phù hợp cho doanh nghiệp.</p>
                    <button class="btn btn-primary">Chọn gói</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
